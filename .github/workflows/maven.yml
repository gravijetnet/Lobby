name: Build Lobby

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Erlaubt es dir, den Build manuell zu starten

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Move JAR to root and Commit
      run: |
        # Sucht die Lobby JAR, ignoriert shaded/sources/javadoc
        JAR_PATH=$(find target/ -name "Lobby-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "Fehler: Keine Lobby JAR gefunden!"
          exit 1
        fi
        
        echo "Gefundene Datei: $JAR_PATH"
        mv "$JAR_PATH" ./lobby-latest.jar
        
        # Git Bot konfigurieren
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Datei mit Force (-f) hinzufügen, falls .gitignore sie blockiert
        git add -f lobby-latest.jar
        git commit -m "Update Lobby JAR [skip ci]" || echo "No changes to commit"
        git push
