name: Build and Release Lobby

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for creating Releases

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR for Release
      run: |
        # Find the correct Lobby JAR (excluding shaded, sources, javadoc)
        JAR_PATH=$(find target/ -name "Lobby-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "Error: No Lobby JAR found!"
          exit 1
        fi
        
        # Copy to a fixed name for the release
        cp "$JAR_PATH" ./lobby-latest.jar

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Lobby Latest Build"
        body: "Automated build from commit ${{ github.sha }} \nDate: ${{ github.event.head_commit.timestamp }}"
        draft: false
        prerelease: false
        files: lobby-latest.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
