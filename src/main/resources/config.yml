# Lobby block settings
# Diamond blocks placed by players transform over time:
#   Diamond Block -> Emerald Block (after first-change-ticks) -> Air (after remove-ticks)
lobby-blocks:
  first-change-ticks: 100   # 5 seconds (20 ticks/sec * 5)
  remove-ticks: 140         # 7 seconds total (20 ticks/sec * 7)

# Spawn location
spawn:
  world: spawn
  x: 20.5
  y: 112.0
  z: -173.5
  yaw: -135.0
  pitch: 0.0

# Visibility permission configuration
# Set the permission node that identifies VIP and Staff players for the visibility filter
visibility:
  vip-permission: "lobby.visibility.vip"
  staff-permission: "lobby.visibility.staff"

# Server Selector Configuration
server-selector:
  default:
    title: '&cServer Selector'
    size: 27
    items:
      fastbuilder:
        slot: 10
        material: SANDSTONE
        name: '&cFastbuilder'
        lore:
          - ''
          - '&7Practice techniques such as Speed-, God-, and Tellybridging.'
          - '&7Ideal training for BedWars and competitive scenarios.'
          - ''
          - '&aClick to connect!'
          - '&7%phoenix_server_online_Fastbuilder-1% currently playing'
        actions:
          - connect:Fastbuilder-1
      practice:
        slot: 12
