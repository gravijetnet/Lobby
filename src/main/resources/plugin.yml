name: LobbyPlugin
version: 1.0.0
main: net.gravijet.lobby.Main
depend: [PlaceholderAPI]
softdepend: [PhoenixAPI]
commands:
  build:
    description: Toggle build mode
    usage: /<command>
  setspawn:
    description: Set the lobby spawn
    usage: /<command>
  spawn:
    description: Teleport to spawn
    usage: /<command>
  fly:
    description: Toggle fly mode
    usage: /<command>
  zone:
    description: Manage lobby placement zones
    usage: /zone <wand|save|delete|list|clear|info|setperm|clearperm|setmessage|setblockplace>
    permission: lobby.zone
  lobbyreload:
    description: Reloads the plugin configuration
    usage: /<command>
    permission: lobby.reload
  jumppad:
    description: Manage jumppads
    usage: /jumppad <add|remove|list>
    permission: lobby.jumppad
  getspeedcookie:
    description: Get a Speed Cookie
    usage: /<command>
permissions:
  lobby.build:
    description: Access to build mode
    default: op
  lobby.setspawn:
    description: Set spawn location
    default: op
  lobby.fly:
    description: Use fly in lobby
    default: op
  lobby.visibility.vip:
    description: VIP visibility
    default: false
  lobby.visibility.staff:
    description: Staff visibility
    default: op
  lobby.zone:
    description: Manage placement zones and see zone outlines
    default: op
  lobby.reload:
    description: Reload the plugin configuration
    default: op
  lobby.jumppad:
    description: Manage jumppads
    default: op
